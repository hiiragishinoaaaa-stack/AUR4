<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0d13">
<title>AURA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0e0d13;--panel:#17151f;--panel2:#221f2e;--line:#2c2839;--text:#efedf5;--dim:#8f8aa3;--acc:#7c5cff;--acc2:#c3b5ff;--danger:#ff5d7d;--row:44px;--lab:40px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100%;overflow:hidden;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
.logo{font-weight:800;letter-spacing:.32em;font-size:16px;margin-right:auto}
.hb{height:36px;min-width:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;font-size:13px}
.hb:disabled{opacity:.3}
.hb.pri{background:var(--acc);border-color:var(--acc);font-weight:700;padding:0 14px}
.rico{border:1.6px solid currentColor;border-radius:2px;display:inline-block}
#stage{flex:1 1 auto;min-height:130px;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden;padding:6px}
#cv{max-width:100%;max-height:100%;display:block;background:#000;box-shadow:0 0 0 1px #222;touch-action:none}
body.moving #cv{box-shadow:0 0 0 2px var(--acc)}
#ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
#ovl [data-h]{pointer-events:all;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#empty button{border:1.5px dashed #4a4560;background:transparent;border-radius:14px;padding:16px 22px;color:var(--acc2);font-size:15px}
#transport{display:flex;align-items:center;gap:8px;padding:6px 12px;flex:none;border-top:1px solid var(--line)}
#play{width:48px;height:36px;border-radius:10px;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
#time{font-variant-numeric:tabular-nums;font-size:13px}
#time span{color:var(--dim)}
#kfb{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--text)}
#kfb.dis{opacity:.28}
#kfb.on{color:#fff;background:var(--acc);border-color:var(--acc)}
#kfb.gold{color:#2a1d00;background:#ffc93c;border-color:#ffc93c}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:17px}
.ib.on{color:var(--acc2);border-color:var(--acc)}
#tlbox{position:relative;flex:none;height:30vh;min-height:120px;border-top:1px solid var(--line);background:var(--panel)}
body.panel #tlbox{height:128px;min-height:128px}
#tl{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;scrollbar-width:none}
#tl::-webkit-scrollbar{display:none}
#ph{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;z-index:8;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.6)}
.row{display:flex;height:var(--row);border-bottom:1px solid var(--line)}
.lab{position:sticky;left:0;z-index:5;width:var(--lab);flex:none;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);border-right:1px solid var(--line)}
.lane{position:relative;flex:none}
.ruler{height:22px;position:sticky;top:0;z-index:6;background:var(--panel2)}
.ruler .lab{z-index:7}
.tick{position:absolute;top:0;height:100%;border-left:1px solid #3a3550;font-size:10px;color:var(--dim);padding:3px 0 0 3px;pointer-events:none}
.addrow .lane{display:flex;align-items:center}.addhint{font-size:11px;color:var(--dim);white-space:nowrap;padding-left:8px}.addtr{font-size:20px;color:var(--acc2)!important}.deltr{font-size:14px;color:var(--dim)!important}
.eye{width:34px;height:34px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0}
.eye.off{color:#55506a}
.clip{position:absolute;top:5px;bottom:5px;border-radius:7px;background:#3a3358 center/cover no-repeat;overflow:hidden;font-size:10px;color:#fff;display:flex;align-items:flex-end;padding:0 6px 3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.clip::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.65));pointer-events:none}
.clip span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip.fx{background:#4a3517;color:#ffd699}
.clip.au{background:#123d33;color:#aef0dc}
.clip.tx{background:#2d2744}
.clip.hid{opacity:.35}
.clip.sel{box-shadow:0 0 0 2px var(--acc2);touch-action:none;z-index:2;overflow:visible}
.clip .gt{position:absolute;left:0;right:0;top:0;height:4px;pointer-events:none;z-index:1}
body.picking .clip:not(.fx):not(.au){outline:1.5px dashed #ffc93c;outline-offset:-2px}
.clip .tb{position:absolute;top:3px;left:5px;font-size:9px;background:rgba(0,0,0,.55);border-radius:4px;padding:1px 4px;font-style:normal;pointer-events:none}
.hl,.hr{position:absolute;top:0;bottom:0;width:18px;display:none;background:var(--acc2);z-index:1}
.hl{left:-2px;border-radius:7px 0 0 7px}.hr{right:-2px;border-radius:0 7px 7px 0}
.hl::after,.hr::after{content:"";position:absolute;left:8px;top:35%;bottom:35%;width:2px;background:#2a2340;border-radius:2px}
.clip.sel .hl,.clip.sel .hr{display:block}
.kd{position:absolute;top:50%;width:11px;height:11px;margin:-6px 0 0 -6px;transform:rotate(45deg);background:#fff;border:2px solid var(--acc);z-index:3}
.kd.on{background:var(--acc)}
.kd.last{background:#ffc93c;border-color:#b8860b;width:13px;height:13px;margin:-7px 0 0 -7px}
.kd.last.on{background:#ffb000;box-shadow:0 0 0 3px rgba(255,201,60,.35)}
.mk{position:absolute;bottom:2px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#ffd23f;pointer-events:none}
.gbtn{flex:1}
.jn{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:6px;background:#fff;color:#2a2340;z-index:4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.jn.on{background:var(--acc);color:#fff}
#panel{flex:none;max-height:34vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:0 14px 14px;display:none}
body.panel #panel{display:block}
.pt{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;padding:10px 0 6px;z-index:1}
.pt b{font-size:14px;margin-right:auto}
.pt button{border:0;background:var(--panel2);width:30px;height:30px;border-radius:9px;font-size:15px}
.rc{display:grid;grid-template-columns:86px 1fr 54px;align-items:center;gap:8px;min-height:38px;font-size:13px}
.rc .v{text-align:right;color:var(--acc2);font-variant-numeric:tabular-nums;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc);height:26px;margin:0}
.sec{font-size:12px;color:var(--dim);margin:12px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 11px;font-size:13px}
.ttabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.ttabs::-webkit-scrollbar,.chips.row::-webkit-scrollbar{display:none}
.ttabs button{flex:none;white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:6px 13px;font-size:12.5px}
.ttabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ttabs.main{padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.ttabs.main button{font-size:13px;padding:7px 14px}
.chips.sm{gap:6px}.chips.sm .chip{padding:6px 10px;font-size:12px;border-radius:8px}
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips.row .chip{flex:none;white-space:nowrap}
details.fold{border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 12px;background:rgba(255,255,255,.025)}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 0;font-size:13px;font-weight:600;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▾";margin-left:auto;color:var(--dim);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold[open]{padding-bottom:10px}
.fs{font-weight:400;color:var(--acc2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.tcur{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);margin:6px 0 8px;min-width:0}
.tcur b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcur .mini{margin-left:auto;flex:none;border:0;background:var(--acc);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px}
.chip.on{border-color:var(--acc);background:#2e2552;color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 13px;font-size:13px}
.btn.pri{background:var(--acc);border-color:var(--acc);font-weight:700}
.btn.dng{border-color:var(--danger);color:var(--danger);background:transparent}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:3px;margin:6px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.note{font-size:12px;color:var(--dim);line-height:1.6;margin:8px 0}
.txtin{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:15px;-webkit-user-select:text;user-select:text}
input[type=color]{width:40px;height:30px;border:0;background:none;padding:0}
#nav{display:flex;overflow-x:auto;flex:none;border-top:1px solid var(--line);background:var(--bg);scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:1 0 66px;min-width:66px;border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);white-space:nowrap}
#nav button.on{color:var(--acc2)}
#nav button.dng{color:var(--danger)}
#nav svg{width:22px;height:22px}
#ov{position:fixed;inset:0;background:rgba(8,7,12,.88);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center}
#ov.open{display:flex}
.bar{width:220px;height:6px;background:#2c2839;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.full{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 0%,#2a1f5c,#0e0d13 62%);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 30px}
.full.open{display:block}
#admin{background:var(--bg)}
.authbox{max-width:380px;margin:9vh auto 0;display:flex;flex-direction:column;gap:10px}
.alogo{font-weight:900;letter-spacing:.4em;font-size:36px;text-align:center;background:linear-gradient(90deg,#e4dcff,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.asub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:14px}
.alink{background:none;border:0;color:var(--acc2);font-size:13px;padding:6px}
.admin-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stat{background:var(--panel2);border-radius:12px;padding:14px;flex:1 1 40%;text-align:center}.stat b{display:block;font-size:26px}
.banner{position:fixed;top:64px;left:12px;right:12px;z-index:65;background:#2e2552;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
#onionChip{position:absolute;left:8px;top:8px;z-index:5;display:none;align-items:center;gap:4px;background:rgba(20,18,30,.85);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:11.5px;color:var(--text)}
#onionChip button{border:0;background:var(--panel2);color:var(--dim);border-radius:999px;padding:5px 9px;font-size:11.5px}
#onionChip button.on{background:var(--acc);color:#fff}#onionChip button.x{background:transparent;color:#fff;font-size:13px}
#cutEd{position:fixed;inset:0;z-index:72;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#cutEd.open{display:flex}
#cutEd .cv{flex:1;position:relative;min-height:0;touch-action:none}
#cutEd canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cutEd .ctop{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
#cutEd .opts{flex:none;max-height:40vh;overflow:auto;padding:4px 14px 14px;border-top:1px solid var(--line);background:var(--panel)}
#toast{z-index:90;position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2e2552;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;line-height:1.5}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">AURA</div>
  <button class="hb" id="ratioBtn"><i class="rico" id="ratioIco"></i><span id="ratioLbl">9:16</span></button>
  <button class="hb" id="undo" aria-label="元に戻す"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="hb" id="redo" aria-label="やり直す"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="hb pri" id="exportBtn">書き出し</button>
</header>
<div id="stage"><canvas id="cv"></canvas><svg id="ovl"></svg><div id="empty"><button id="emptyAdd">＋ 写真・動画を追加</button></div></div>
<div id="transport">
  <button id="play" aria-label="再生"></button>
  <div id="time">0:00.00 <span>/ 0:00.00</span></div>
  <button id="kfb" class="dis" aria-label="キーフレーム"></button>
  <div class="sp"></div>
  <button class="ib on" id="loopBtn" aria-label="ループ">⟳</button>
  <button class="ib" id="zout" aria-label="縮小">−</button>
  <button class="ib" id="zin" aria-label="拡大">＋</button>
</div>
<div id="tlbox"><div id="tl"><div id="tlin"></div></div><div id="ph"></div></div>
<div id="panel"></div>
<nav id="nav"></nav>
<div id="ov"></div>
<div id="toast"></div>
<div id="auth" class="full"><div class="authbox"><div class="alogo">AURA</div><div class="asub">動画・漫画edit用エディター</div><div id="authBody" style="display:flex;flex-direction:column;gap:10px"></div></div></div>
<div id="admin" class="full"></div>
<input type="file" id="fMedia" accept="image/*,video/*" multiple hidden>
<input type="file" id="fAudio" accept="audio/*,video/*" hidden>
<input type="file" id="fLib" accept="image/*,video/*,audio/*" multiple hidden>
<input type="file" id="fBk" accept=".aura,application/octet-stream,*/*" hidden>
<input type="file" id="fReplace" accept="image/*,video/*" hidden>
<script type="x-shader/x-fragment" id="sh-head">
varying vec2 uv;uniform sampler2D A;uniform sampler2D B;uniform float p;uniform float ar;uniform float amt;uniform float seed;uniform vec2 v;uniform float rgb;uniform vec2 res;uniform vec4 wq;uniform vec4 wr;
vec4 tA(vec2 q){if(q.x<0.||q.y<0.||q.x>1.||q.y>1.)return vec4(0.);return texture2D(A,q);}
vec4 tB(vec2 q){if(q.x<0.||q.y<0.||q.x>1.||q.y>1.)return vec4(0.);return texture2D(B,q);}
vec2 mir(vec2 q){return 1.-abs(1.-mod(q,2.));}
vec4 mA(vec2 q){return texture2D(A,mir(q));}
vec4 mB(vec2 q){return texture2D(B,mir(q));}
vec2 rot(vec2 w,float a){float s=sin(a);float c=cos(a);return vec2(c*w.x-s*w.y,s*w.x+c*w.y);}
vec2 toC(vec2 q){vec2 c=q-.5;c.x*=ar;return c;}
vec2 toU(vec2 c){c.x/=ar;return c+.5;}
float hash(float n){return fract(sin(n)*43758.5453);}
float eio(float t){return t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)/2.;}
float whip(float t){if(t<=0.)return 0.;if(t>=1.)return 1.;return t<.5?.5*pow(2.,20.*t-10.):1.-.5*pow(2.,-20.*t+10.);}
vec4 over(vec4 t,vec4 b){float a=t.a+b.a*(1.-t.a);if(a<.0001)return vec4(0.);return vec4((t.rgb*t.a+b.rgb*b.a*(1.-t.a))/a,a);}
vec2 gdisp(vec2 q,float g){float fr=floor(seed);float rows=12.+floor(hash(fr)*22.);float row=floor(q.y*rows);float h=hash(row*13.1+fr*7.3);
 float dx=h>(.6-.45*g)?(hash(row*3.7+fr*1.9)-.5)*.5*g:0.;float j=(mod(fr,2.)<1.?1.:-1.)*(.45+.55*hash(fr*1.7))*.09*g;return q+vec2(dx+j,0.);}
vec4 suckB(vec2 c,float r,float pb){float eb=1.-pow(1.-pb,3.);vec4 b=vec4(0.);float twb=-(1.-eb)*6.*amt*exp(-2.*r);float scb=1./(1.+(1.-eb)*.8);
 for(int i=0;i<8;i++){float f=float(i)/7.;b+=mB(toU(rot(c,twb)*scb*(1.-f*.1*(1.-eb))));}return b/8.;}
vec2 lensP(vec2 c,float k,float g){float R=length(vec2(ar,1.))*.5;float r=length(c);if(r<.00001)return c;float rs=pow(r/R,1.-k)*R*g;return c/r*rs;}
vec4 pinchB(vec2 c,float pb){float eo=1.-pow(1.-pb,3.);return tB(toU(c/(1.+.06*(1.-eo))));}
float vn(vec2 x){vec2 i=floor(x);vec2 f=fract(x);f=f*f*(3.-2.*f);float a=hash(i.x+i.y*57.);float b=hash(i.x+1.+i.y*57.);float c=hash(i.x+(i.y+1.)*57.);float d=hash(i.x+1.+(i.y+1.)*57.);return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float lumA(vec2 q){return dot(texture2D(A,clamp(q,0.,1.)).rgb,vec3(.299,.587,.114));}
vec2 sqw(vec2 c,float k){float r=pow(pow(abs(c.x),4.)+pow(abs(c.y),4.),.25);if(r<.0001)return c;return c*pow(r,-k);}
vec2 sqwR(vec2 c,float k,float R,float n){float r=(n>1.5&&n<2.5)?length(c):pow(pow(abs(c.x),4.)+pow(abs(c.y),4.),.25);float rr=max(r,R);if(rr<.0001)return c;return c*pow(rr,-k);}
</script>
<script type="x-shader/x-fragment" id="sh-suck">
void main(){vec2 c=toC(uv);float r=length(c);
 float pa=clamp(p/.62,0.,1.);float ea=pa*pa;float k=.88*smoothstep(0.,.62,pa)*min(amt,1.1);float g=1.+16.*pow(smoothstep(.42,1.,pa),2.)*amt;
 vec4 a=vec4(0.);for(int i=0;i<8;i++){float f=float(i)/7.;a+=tA(toU(lensP(c,k,g*(1.+f*.18*ea))));}a/=8.;
 a.a*=1.-smoothstep(.55,.68,p);
 vec4 b=pinchB(c,clamp((p-.3)/.7,0.,1.));
 vec4 col=over(a,b);float glow=exp(-r*14.)*smoothstep(.4,.6,p)*(1.-smoothstep(.62,.85,p))*.8;col.rgb=min(col.rgb+glow,1.);gl_FragColor=col;}
</script>
<script type="x-shader/x-fragment" id="sh-uzu">
void main(){vec2 c=toC(uv);float r=length(c);
 float e=clamp(p/.85,0.,1.);e=e*e*(3.-2.*e);e=e*e;
 float tw=(e*14.*exp(-2.5*r)+e*2.)*amt;float sc=1.+e*e*40.+e*3.*amt*exp(-5.*r);
